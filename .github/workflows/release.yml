name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: 编译
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          go build -trimpath -tags "netgo osusergo" -ldflags "-s -w -X main.version=${VERSION}" \
            -o fanout .

      - name: 打包
        run: |
          tar czf "fanout-linux-${{ matrix.goarch }}.tar.gz" \
            fanout install.sh f.sh fanout.service README.md

      - uses: actions/upload-artifact@v4
        with:
          name: fanout-linux-${{ matrix.goarch }}
          path: fanout-linux-${{ matrix.goarch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: 生成校验和
        run: sha256sum fanout-linux-*.tar.gz > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            fanout-linux-*.tar.gz
            checksums.txt
          generate_release_notes: true
